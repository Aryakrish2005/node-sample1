
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Hospital Appointment</h1>
        <p>Book your appointment with our doctors.</p>

        <form id="appointmentForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="doctor">Choose Doctor</label>
            <select id="doctor" required>
                <option value="">Select a doctor</option>
                <option value="Dr. John">Dr. John - Cardiology</option>
                <option value="Dr. Sarah">Dr. Sarah - Dermatology</option>
                <option value="Dr. Michael">Dr. Michael - Orthopedics</option>
            </select>

            <label for="date">Appointment Date</label>
            <input type="date" id="date" required>

            <button type="submit">Book Appointment</button>
        </form>

        <p id="message"></p>

        <h2>Appointments</h2>
        <div id="appointments"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
